[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[project]
name = "queryatlas-warehouse"
version = "0.1.0"
requires-python = ">=3.11"
[project.optional-dependencies]
test = ["pytest>=9.2.0"]
[tool.setuptools.packages.find]
include = ["queryatlas*"]
[tool.setuptools.package-data]
queryatlas = ["sql/*.sql"]
